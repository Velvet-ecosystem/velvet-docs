name: Distributed Ghost Integration

on:
  pull_request:
    paths:
      - "acceptance/**"
      - "compatibility/**"
      - "ghost/**"
      - "tests/**"
      - "docs/compatibility_ledger.md"
      - "docs/current_software_acceptance.md"
      - "docs/distributed_body_ghost_run.md"
      - ".github/workflows/distributed-ghost-integration.yml"
  push:
    branches: [main]
    paths:
      - "acceptance/**"
      - "compatibility/**"
      - "ghost/**"
      - "tests/**"
      - ".github/workflows/distributed-ghost-integration.yml"
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      dependency_override:
        description: "Optional candidate override: known-public-repository=full-commit-SHA"
        required: false
        type: string

permissions:
  contents: read

jobs:
  distributed-ghost:
    name: ${{ matrix.mode }} software / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [pinned, candidate]
        python: ["3.8", "3.10", "3.11", "3.12"]
    steps:
      - name: Check out acceptance harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare exact source inputs and verify pinned trees
        env:
          ACCEPTANCE_MODE: ${{ matrix.mode }}
          DEPENDENCY_OVERRIDE: ${{ inputs.dependency_override }}
        shell: bash
        run: |
          mkdir -p acceptance-results
          git rev-parse HEAD > acceptance-results/harness-commit.txt
          python --version > acceptance-results/python-version.txt
          args=()
          if [ "$ACCEPTANCE_MODE" = candidate ]; then
            args+=(--candidate)
            if [ -n "$DEPENDENCY_OVERRIDE" ]; then
              args+=(--override "$DEPENDENCY_OVERRIDE")
            fi
          fi
          python acceptance/prepare_sources.py --destination "$GITHUB_WORKSPACE/.acceptance-deps" "${args[@]}" > acceptance-results/preparation.log 2>&1
      - name: Install explicit software test dependencies
        run: |
          python -m pip install 'pytest==8.3.5' 'PyYAML>=6,<7' \
            -e .acceptance-deps/velvet-ai-core \
            -e .acceptance-deps/velvet-language \
            -e .acceptance-deps/velours_library \
            -e .acceptance-deps/velvet-receipts \
            -e .acceptance-deps/velvet-event-protocol \
            -e .acceptance-deps/velvet-continuity-spine
          python -m pip freeze > acceptance-results/python-packages.txt
      - name: Run complete cross-repository acceptance and retained Ghost guardrails
        run: python -m pytest acceptance tests .acceptance-deps/velvet-ai-core/acceptance -q -ra --junitxml=acceptance-results/integration.xml
      - name: Exercise recorded Founder companions
        if: matrix.python == '3.8' || matrix.python == '3.12'
        shell: bash
        run: |
          for repo in velvet-interface velvet-vehicle-can velvet-communications; do
            python -m pip install -e ".acceptance-deps/$repo"
            (cd ".acceptance-deps/$repo" && python -m pytest tests -q -ra --junitxml="$GITHUB_WORKSPACE/acceptance-results/$repo.xml")
          done
      - name: Exercise Audio on its intentional Python 3.11 floor and Communications preferred lane
        if: matrix.python == '3.11'
        shell: bash
        run: |
          for repo in velvet-audio-studio velvet-communications; do
            python -m pip install -e ".acceptance-deps/$repo"
            (cd ".acceptance-deps/$repo" && python -m pytest tests -q -ra --junitxml="$GITHUB_WORKSPACE/acceptance-results/$repo.xml")
          done
      - name: Record final environment
        if: always()
        run: python -m pip freeze > acceptance-results/final-python-packages.txt
      - name: Preserve exact inputs, preparation failures and executed results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: software-${{ matrix.mode }}-python-${{ matrix.python }}
          path: |
            acceptance-results/
            .acceptance-deps/tested-inputs.json
