name: Validate ecosystem map

on:
  pull_request:
    paths:
      - ecosystem.yaml
      - schemas/velvet-ecosystem.schema.json
      - .github/workflows/validate-ecosystem-map.yml
  push:
    branches:
      - main
    paths:
      - ecosystem.yaml
      - schemas/velvet-ecosystem.schema.json
      - .github/workflows/validate-ecosystem-map.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check "PyYAML>=6,<7" "jsonschema>=4.23,<5"

      - name: Validate ecosystem.yaml
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import yaml
          from jsonschema import Draft202012Validator

          schema_path = Path("schemas/velvet-ecosystem.schema.json")
          ecosystem_path = Path("ecosystem.yaml")

          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          ecosystem = yaml.safe_load(ecosystem_path.read_text(encoding="utf-8"))

          validator = Draft202012Validator(schema)
          errors = sorted(validator.iter_errors(ecosystem), key=lambda error: list(error.path))

          if errors:
              for error in errors:
                  location = ".".join(str(part) for part in error.absolute_path) or "<root>"
                  print(f"::error title=Invalid ecosystem map::{location}: {error.message}")
              raise SystemExit(1)

          print("ecosystem.yaml is valid against schemas/velvet-ecosystem.schema.json")
          PY
